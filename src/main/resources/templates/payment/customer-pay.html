<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Pay invoice')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>
<div th:replace="~{fragments/common :: flash}"></div>

<section class="section">
    <div class="container form-panel">
        <a class="muted" th:href="@{'/customer/invoices/' + ${invoice.id}}">&larr; Back to invoice</a>
        <p class="eyebrow" style="margin-top:var(--space-2)">Secure checkout (demo)</p>
        <h1>Pay invoice #<span th:text="${invoice.id}">1</span></h1>
        <p class="muted">
            A copy of this invoice was sent to
            <strong th:text="${invoice.customer.email}">email</strong>.
        </p>

        <div class="card" style="margin-bottom:var(--space-3)">
            <p style="margin:0">
                <strong th:text="${invoice.booking.machine.model}">Machine</strong>
                &middot;
                <span th:text="${invoice.booking.startDate}">s</span>
                &rarr;
                <span th:text="${invoice.booking.endDate}">e</span>
            </p>
            <p class="muted" style="margin:.35rem 0 0"
               th:if="${invoice.booking.jobSiteLabel != null and !#strings.isEmpty(invoice.booking.jobSiteLabel)}"
               th:text="${invoice.booking.jobSiteLabel}">Site</p>
            <div class="stat" style="margin-top:var(--space-2)">
                <span th:text="${currencySymbol}">Rs.</span>
                <span th:text="${#numbers.formatDecimal(invoice.balance,1,'COMMA',2,'POINT')}">0</span>
            </div>
            <p class="muted" style="margin:0">Amount due now</p>
        </div>

        <form class="card pay-portal" th:action="@{'/customer/invoices/' + ${invoice.id} + '/pay'}" method="post">
            <p class="muted" style="margin-top:0">Demo payment portal — no real card is charged.</p>
            <div class="field">
                <label for="cardholderName">Cardholder name</label>
                <input class="input" id="cardholderName" name="cardholderName" required
                       autocomplete="cc-name" placeholder="Name on card"/>
            </div>
            <div class="field">
                <label for="cardNumber">Card number</label>
                <input class="input" id="cardNumber" name="cardNumber" required
                       inputmode="numeric" autocomplete="cc-number"
                       placeholder="4242 4242 4242 4242" maxlength="19"/>
            </div>
            <div class="form-row">
                <div class="field">
                    <label for="expiry">Expiry</label>
                    <input class="input" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5"/>
                </div>
                <div class="field">
                    <label for="cvc">CVC</label>
                    <input class="input" id="cvc" name="cvc" placeholder="123" maxlength="4" inputmode="numeric"/>
                </div>
            </div>
            <button class="btn btn-primary" type="submit">
                Pay <span th:text="${currencySymbol}">Rs.</span>
                <span th:text="${#numbers.formatDecimal(invoice.balance,1,'COMMA',2,'POINT')}">0</span>
            </button>
        </form>
    </div>
</section>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
