<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Reports')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>
<div th:replace="~{fragments/common :: flash}"></div>

<section class="section">
    <div class="container">
        <div class="page-head">
            <div>
                <p class="eyebrow">Admin &middot; Reports</p>
                <h1>Bookings &amp; revenue</h1>
            </div>
            <a class="btn btn-ghost" th:href="@{/admin/dashboard}">Dashboard</a>
        </div>

        <div class="grid grid-3" style="margin-bottom:var(--space-5)">
            <div class="card">
                <p class="muted" style="margin:0">Total invoiced</p>
                <div class="stat"><span th:text="${currencySymbol}">Rs.</span>
                    <span th:text="${#numbers.formatDecimal(report.totalInvoiced,1,'COMMA',2,'POINT')}">0</span></div>
            </div>
            <div class="card">
                <p class="muted" style="margin:0">Collected</p>
                <div class="stat"><span th:text="${currencySymbol}">Rs.</span>
                    <span th:text="${#numbers.formatDecimal(report.totalCollected,1,'COMMA',2,'POINT')}">0</span></div>
            </div>
            <div class="card">
                <p class="muted" style="margin:0">Outstanding</p>
                <div class="stat"><span th:text="${currencySymbol}">Rs.</span>
                    <span th:text="${#numbers.formatDecimal(report.outstanding,1,'COMMA',2,'POINT')}">0</span></div>
            </div>
        </div>

        <div class="grid grid-2">
            <div class="card">
                <h3>Bookings by status</h3>
                <div class="table-wrap">
                    <table class="data">
                        <thead><tr><th>Status</th><th>Count</th></tr></thead>
                        <tbody>
                        <tr th:each="entry : ${report.bookingCounts}">
                            <td th:text="${entry.key.displayName}">Status</td>
                            <td th:text="${entry.value}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card">
                <h3>Invoices by status</h3>
                <div class="table-wrap">
                    <table class="data">
                        <thead><tr><th>Status</th><th>Count</th></tr></thead>
                        <tbody>
                        <tr th:each="entry : ${report.invoiceCounts}">
                            <td th:text="${entry.key}">Status</td>
                            <td th:text="${entry.value}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
