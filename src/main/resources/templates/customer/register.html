<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Create account')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="auth-wrap">
    <div class="card auth-card">
        <p class="eyebrow">Join DozerNet</p>
        <h1 style="font-size:1.8rem">Create your account</h1>

        <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">error</div>
            </div>
            <div class="field">
                <label for="fullName">Full name</label>
                <input class="input" id="fullName" type="text" th:field="*{fullName}" placeholder="Chamara Perera"/>
                <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input class="input" id="email" type="email" th:field="*{email}" placeholder="you@example.com"/>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input class="input" id="phone" type="text" th:field="*{phone}" placeholder="0771234567"/>
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="form-row">
                <div class="field">
                    <label for="password">Password</label>
                    <input class="input" id="password" type="password" th:field="*{password}" placeholder="Min 8 characters"/>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="field">
                    <label for="confirmPassword">Confirm password</label>
                    <input class="input" id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Re-enter password"/>
                    <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>

        <p class="muted" style="margin-top:var(--space-3);text-align:center">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </p>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
