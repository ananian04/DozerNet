<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Assign operators')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>
<div th:replace="~{fragments/common :: flash}"></div>

<section class="section">
    <div class="container">
        <div class="page-head">
            <div>
                <p class="eyebrow">Admin &middot; Assignments</p>
                <h1>Approved bookings awaiting an operator</h1>
            </div>
            <a class="btn btn-ghost" th:href="@{/admin/operators}">Operators</a>
        </div>

        <p class="muted" th:if="${#lists.isEmpty(bookings)}">No approved bookings need an operator right now.</p>
        <div class="alert alert-info" th:if="${!#lists.isEmpty(bookings) and #lists.isEmpty(operators)}">
            There are no verified operators yet. Add or verify an operator first.
        </div>

        <div class="table-wrap" th:unless="${#lists.isEmpty(bookings)}">
            <table class="data">
                <thead>
                <tr><th>Customer</th><th>Machine</th><th>Dates</th><th>Assign operator</th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td th:text="${b.customer.fullName}">Customer</td>
                    <td th:text="${b.machine.model}">Machine</td>
                    <td><span th:text="${b.startDate}">start</span> &rarr; <span th:text="${b.endDate}">end</span></td>
                    <td>
                        <form th:action="@{/admin/assignments/assign}" method="post" style="display:flex;gap:.3rem">
                            <input type="hidden" name="bookingId" th:value="${b.id}"/>
                            <select class="select" name="operatorId" style="padding:.35rem .5rem" required>
                                <option value="" disabled selected>Select operator</option>
                                <option th:each="o : ${operators}" th:value="${o.user.id}"
                                        th:text="${o.user.fullName} + ' (' + ${o.experienceYears} + ' yr)'"></option>
                            </select>
                            <button class="btn btn-primary btn-sm" type="submit" th:disabled="${#lists.isEmpty(operators)}">Assign</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
