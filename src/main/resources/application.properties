# ==========================================================================
# DozerNet - main configuration
# Default profile is "h2" so the app runs instantly with no DB setup.
# Switch to MySQL (for MySQL Workbench) by setting: spring.profiles.active=mysql
# ==========================================================================
spring.application.name=DozerNet
spring.profiles.active=h2

# Thymeleaf
spring.thymeleaf.cache=false

# JPA (common)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Currency / locale (Sri Lanka)
dozernet.currency-symbol=Rs.
dozernet.locale=en-LK

# Show SQL for learning/demo transparency
spring.jpa.show-sql=false
